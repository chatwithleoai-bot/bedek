<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקנות החשמל - מיתקני חשמל במבנים שיש בהם מקלחת או אמבטיה</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">אזורי בטיחות ודרגת הגנה IPX4 מזערית מפני חדירת מים והתזה</text>
  
  <!-- Diagram Content -->
  
            <!-- Shower stall outline -->
            <rect x="220" y="160" width="160" height="220" fill="#f0fdf4" stroke="#0284c7" stroke-width="3"/>
            <text x="300" y="270" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0284c7" text-anchor="middle">אזור 1 (תא רחצה)</text>
            
            <!-- Shower head -->
            <circle cx="300" cy="180" r="10" fill="#0284c7"/>
            <line x1="300" y1="180" x2="300" y2="210" stroke="#0284c7" stroke-width="3" stroke-dasharray="3"/>
            
            <!-- Safe electrical socket zone 3 -->
            <rect x="460" y="220" width="50" height="60" fill="#fef2f2" stroke="#dc2626" stroke-width="3" rx="4"/>
            <text x="485" y="255" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">IPX4</text>
            
            <!-- Distance line -->
            <line x1="380" y1="300" x2="460" y2="300" stroke="#16a34a" stroke-width="2"/>
            <text x="420" y="295" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">לפחות 60 ס"מ</text>
            
            <text x="400" y="420" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">איסור על בתי נורה פתוחים או מפסקים לא מוגנים באזורי הרחצה</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>