<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 1752 - איטום גגות ומשטחים מרוצפים</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">רולקות בטון 10 ס"מ, הגבהת סף דלת והגנה מכנית</text>
  
  <!-- Diagram Content -->
  
            <!-- Wall & Floor cross section -->
            <rect x="200" y="150" width="80" height="240" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
            <rect x="200" y="390" width="450" height="40" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
            
            <!-- Fillet / Rolka -->
            <polygon points="280,390 280,340 330,390" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
            
            <!-- Membrane line -->
            <path d="M 275 220 L 275 340 L 325 390 L 650 390" fill="none" stroke="#0284c7" stroke-width="6"/>
            
            <!-- Upstand dimension -->
            <line x1="240" y1="390" x2="240" y2="220" stroke="#dc2626" stroke-width="2"/>
            <text x="225" y="305" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="end">עליית איטום (רולקה): לפחות 10-15 ס"מ מעל הריצוף</text>
            
            <!-- Threshold note -->
            <path d="M 450 390 L 520 280 L 620 280" fill="none" stroke="#16a34a" stroke-width="2"/>
            <text x="630" y="284" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="start">הגבהת סף כניסה/יציאה למרפסת: לפחות 5 ס"מ</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>