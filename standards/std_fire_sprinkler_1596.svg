<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 1596 - מערכות מתזים וכיבוי אש אוטומטי</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">מרחקי פריסה, מרווח ממכשולים ומרחק מתקרה</text>
  
  <!-- Diagram Content -->
  
            <!-- Ceiling line -->
            <line x1="150" y1="160" x2="650" y2="160" stroke="#334155" stroke-width="6"/>
            <text x="660" y="165" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="start">תקרה קונבנציונלית</text>
            
            <!-- Sprinkler Pipe -->
            <line x1="200" y1="200" x2="600" y2="200" stroke="#dc2626" stroke-width="5"/>
            <!-- Sprinkler Head -->
            <rect x="390" y="200" width="20" height="25" fill="#dc2626"/>
            <polygon points="385,225 415,225 400,245" fill="#b91c1c"/>
            
            <!-- Spray pattern -->
            <path d="M 400 245 L 250 390 L 550 390 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4" opacity="0.6"/>
            
            <!-- Clearance dimensions -->
            <line x1="360" y1="160" x2="360" y2="225" stroke="#2563eb" stroke-width="2"/>
            <text x="350" y="195" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">מרחק מפזר מתקרה: 2.5 - 30 ס"מ</text>
            
            <line x1="250" y1="410" x2="550" y2="410" stroke="#16a34a" stroke-width="2"/>
            <text x="400" y="430" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">רדיוס נקי ממכשולים ומחיצות: לפחות 45 ס"מ</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>