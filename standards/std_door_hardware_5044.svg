<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 5044 - פרזול דלתות, נעילה ומעצור (סטופר)</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">הגנה על קירות ופרזול נקי משריטות ושיירי מליטה</text>
  
  <!-- Diagram Content -->
  
            <!-- Wall and baseboard -->
            <rect x="180" y="150" width="30" height="230" fill="#94a3b8"/>
            <rect x="180" y="350" width="35" height="30" fill="#64748b"/>
            
            <!-- Floor -->
            <line x1="150" y1="380" x2="650" y2="380" stroke="#334155" stroke-width="4"/>
            
            <!-- Door Leaf opened -->
            <line x1="420" y1="180" x2="250" y2="340" stroke="#b45309" stroke-width="8"/>
            
            <!-- Stopper on floor -->
            <rect x="270" y="355" width="20" height="25" rx="4" fill="#dc2626"/>
            
            <!-- Callout -->
            <path d="M 280 355 L 280 280 L 360 280" fill="none" stroke="#dc2626" stroke-width="2"/>
            <text x="370" y="284" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="start">חובת מעצור דלת (בולם/סטופר) למניעת פגיעה בטיח ובפרזול</text>
            
            <path d="M 420 190 L 520 190" fill="none" stroke="#0284c7" stroke-width="2"/>
            <text x="530" y="194" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#0284c7" text-anchor="start">פרזול ומנגנון נעילה נקי לחלוטין מנתזי טיט וחלודה</text>
            
            <text x="400" y="430" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">פסיקת בתי המשפט ומפמ"כ: סטופר הוא חלק מאיכות בנייה סבירה ותקינה</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>