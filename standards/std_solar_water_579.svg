<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 579 - מערכות סולאריות לחימום מים ודודי שמש</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">אגן ניקוז תקני מתחת לאוגר מים וטמפרטורת אספקה 50 מעלות לפחות</text>
  
  <!-- Diagram Content -->
  
            <!-- Solar storage tank -->
            <rect x="300" y="160" width="200" height="130" rx="30" fill="#f8fafc" stroke="#0284c7" stroke-width="4"/>
            <text x="400" y="230" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0284c7" text-anchor="middle">דוד שמש / אוגר</text>
            
            <!-- Catch tray / Drain pan -->
            <rect x="270" y="300" width="260" height="30" fill="#e2e8f0" stroke="#dc2626" stroke-width="3"/>
            <!-- Drain pipe from tray -->
            <path d="M 500 330 L 500 390 L 580 390" fill="none" stroke="#dc2626" stroke-width="4"/>
            
            <!-- Callout tray -->
            <path d="M 270 315 L 170 315" fill="none" stroke="#dc2626" stroke-width="2"/>
            <text x="160" y="319" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="end">אגן איסוף מחומר עמיד קורוזיה עם צנרת ניקוז</text>
            
            <!-- Temperature callout -->
            <path d="M 400 160 L 400 120 L 550 120" fill="none" stroke="#16a34a" stroke-width="2"/>
            <text x="560" y="124" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="start">טמפרטורת מים חמים מינימלית: 50°C</text>
            
            <text x="400" y="430" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">אגן הניקוז מונע הצפת גגות, חדירת רטיבות לפנטהאוז ונזק לתקרות</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>