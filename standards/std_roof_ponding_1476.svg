<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 1476 ות"י 1752 - שיפועי גגות ומניעת מים עומדים</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">איסור מוחלט על שלוליות בעומק מעל 5 מ"מ ושיפוע מינימום 1.5%</text>
  
  <!-- Diagram Content -->
  
            <!-- Sloped roof surface -->
            <polygon points="180,260 550,330 550,370 180,370" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
            <!-- Drain at low point -->
            <rect x="530" y="325" width="40" height="20" fill="#0284c7"/>
            <path d="M 540 345 L 540 420" fill="none" stroke="#0284c7" stroke-width="6"/>
            
            <!-- Slope arrow -->
            <line x1="240" y1="250" x2="480" y2="295" stroke="#16a34a" stroke-width="3"/>
            <polygon points="485,296 470,285 475,302" fill="#16a34a"/>
            <text x="350" y="260" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">שיפוע תקני לכיוון הנקז: לפחות 1.5%</text>
            
            <!-- Ponding warning -->
            <ellipse cx="320" cy="300" rx="45" ry="10" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <path d="M 320 310 L 320 380 L 220 380" fill="none" stroke="#dc2626" stroke-width="2"/>
            <text x="210" y="384" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="end">אסורה היקוות מים / שלולית בעומק מעל 5 מ"מ</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>