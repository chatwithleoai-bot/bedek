<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 1142 - מעקות ומסעדים במבנים</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">גובה מינימלי 105 ס"מ ומרווח מירבי 10 ס"מ למניעת נפילה</text>
  
  <!-- Diagram Content -->
  
            <!-- Floor / Balcony edge -->
            <rect x="150" y="380" width="500" height="30" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
            
            <!-- Vertical posts -->
            <line x1="220" y1="380" x2="220" y2="180" stroke="#1e293b" stroke-width="8"/>
            <line x1="580" y1="380" x2="580" y2="180" stroke="#1e293b" stroke-width="8"/>
            <!-- Handrail top -->
            <line x1="200" y1="180" x2="600" y2="180" stroke="#1e293b" stroke-width="10"/>
            
            <!-- Infill bars (spacing <= 10cm) -->
            <line x1="270" y1="380" x2="270" y2="185" stroke="#2563eb" stroke-width="4"/>
            <line x1="320" y1="380" x2="320" y2="185" stroke="#2563eb" stroke-width="4"/>
            <line x1="370" y1="380" x2="370" y2="185" stroke="#2563eb" stroke-width="4"/>
            <line x1="420" y1="380" x2="420" y2="185" stroke="#2563eb" stroke-width="4"/>
            <line x1="470" y1="380" x2="470" y2="185" stroke="#2563eb" stroke-width="4"/>
            <line x1="520" y1="380" x2="520" y2="185" stroke="#2563eb" stroke-width="4"/>
            
            <!-- Height dimension -->
            <line x1="180" y1="380" x2="180" y2="180" stroke="#16a34a" stroke-width="2"/>
            <text x="165" y="285" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="end">גובה מינימלי: 105 ס"מ</text>
            
            <!-- Spacing dimension -->
            <line x1="370" y1="280" x2="420" y2="280" stroke="#dc2626" stroke-width="2"/>
            <text x="395" y="265" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">מרווח מקסימלי: 10 ס"מ (כדור בוחן)</text>
            
            <text x="400" y="440" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">איסור על אלמנטים אופקיים המאפשרים טיפוס (שלבים סולמיים) עד גובה 90 ס"מ</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>