<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 466 חלק 1 - חוקת הבטון: כיסוי זיון וגימור</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">עובי כיסוי בטון מינימלי על מוטות זיון ואיסור חוטים שזורים חשופים</text>
  
  <!-- Diagram Content -->
  
            <!-- Concrete slab element -->
            <rect x="220" y="170" width="360" height="190" fill="#cbd5e1" stroke="#334155" stroke-width="4" rx="2"/>
            
            <!-- Rebar steel bar inside -->
            <line x1="250" y1="310" x2="550" y2="310" stroke="#dc2626" stroke-width="10"/>
            <!-- Stirrup / wire -->
            <rect x="330" y="210" width="140" height="110" fill="none" stroke="#dc2626" stroke-width="4"/>
            
            <!-- Cover dimension to bottom -->
            <line x1="400" y1="315" x2="400" y2="360" stroke="#2563eb" stroke-width="2"/>
            <text x="415" y="342" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">עובי כיסוי בטון: לפחות 25-30 מ"מ</text>
            
            <!-- Exposed wire defect warning -->
            <line x1="470" y1="320" x2="470" y2="385" stroke="#ef4444" stroke-width="3"/>
            <text x="470" y="415" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle">איסור על חוטי שזירה או ברזלי זיון חשופים לאוויר</text>
            
            <text x="400" y="440" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">זיון חשוף גורם לחלודה מתפשטת, קורוזיה והתפוררות שכבת הבטון</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>