<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 1918 - נגישות הסביבה הבנויה</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">רוחב מעבר חופשי 90 ס"מ, רדיוס סיבוב 150 ס"מ ומפלס ללא מכשול</text>
  
  <!-- Diagram Content -->
  
            <!-- Clear path corridor -->
            <line x1="220" y1="160" x2="220" y2="380" stroke="#334155" stroke-width="4"/>
            <line x1="580" y1="160" x2="580" y2="380" stroke="#334155" stroke-width="4"/>
            
            <!-- Turning circle (150cm) -->
            <circle cx="400" cy="270" r="85" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" stroke-dasharray="6"/>
            
            <!-- Wheelchair symbol center -->
            <circle cx="400" cy="250" r="10" fill="#0284c7"/>
            <path d="M 400 260 L 400 285 L 420 285" fill="none" stroke="#0284c7" stroke-width="5"/>
            <path d="M 390 280 A 15 15 0 1 0 410 295" fill="none" stroke="#0284c7" stroke-width="4"/>
            
            <!-- Width dimension -->
            <line x1="220" y1="200" x2="580" y2="200" stroke="#2563eb" stroke-width="2"/>
            <text x="400" y="190" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">רוחב מעבר נקי: לפחות 90 ס"מ בפתחים ו-120 ס"מ בפרוזדור</text>
            
            <text x="400" y="420" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">מרחב תמרון וסיבוב 360 מעלות: קוטר נקי של 150 ס"מ</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>