<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 2378 ומפרט כללי - קופינג, אדני חלונות ואף מים</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">חריץ אף מים רציף 8 מ"מ ובליטת אדן חלון 40 מ"מ לפחות</text>
  
  <!-- Diagram Content -->
  
            <!-- Wall section -->
            <rect x="300" y="240" width="200" height="150" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
            
            <!-- Sill Stone (Coping) -->
            <polygon points="260,210 540,225 540,250 260,250" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
            
            <!-- Drip groove (Af Mayim) -->
            <rect x="275" y="243" width="10" height="8" fill="#0284c7"/>
            
            <!-- Slope arrow -->
            <line x1="480" y1="215" x2="350" y2="215" stroke="#16a34a" stroke-width="2"/>
            <polygon points="345,215 360,210 360,220" fill="#16a34a"/>
            <text x="415" y="205" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">שיפוע החוצה לפחות 5%</text>
            
            <!-- Overhang dimension -->
            <line x1="260" y1="265" x2="300" y2="265" stroke="#dc2626" stroke-width="2"/>
            <text x="280" y="280" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">בליטה 40 מ"מ</text>
            
            <!-- Drip groove callout -->
            <path d="M 280 252 L 280 330 L 190 330" fill="none" stroke="#0284c7" stroke-width="2"/>
            <text x="180" y="334" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="end">חריץ אף מים רציף בעומק ורוחב 8 מ"מ</text>
            
            <text x="400" y="430" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">מונע גלישת מי גשמים לחזית הבניין ולשכבת הטיח</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>