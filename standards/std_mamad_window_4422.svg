<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקן ישראלי ת"י 4422 חלק 2 - חלון הדף מפלדה בממ"ד</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">סגירה הרמטית, צירים מאסיביים ואטימות הדף ורסס</text>
  
  <!-- Diagram Content -->
  
            <!-- Window frame -->
            <rect x="280" y="150" width="240" height="220" fill="#cbd5e1" stroke="#1e293b" stroke-width="5"/>
            <!-- Window steel leaf -->
            <rect x="300" y="165" width="200" height="190" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
            <!-- Locking handle -->
            <circle cx="480" cy="260" r="12" fill="#dc2626"/>
            <line x1="480" y1="260" x2="480" y2="300" stroke="#dc2626" stroke-width="5"/>
            
            <!-- Hinges -->
            <rect x="290" y="180" width="12" height="25" fill="#1e293b"/>
            <rect x="290" y="310" width="12" height="25" fill="#1e293b"/>
            
            <!-- Side texts -->
            <path d="M 495 260 L 620 260" fill="none" stroke="#dc2626" stroke-width="2"/>
            <text x="630" y="264" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="start">מנגנון נעילה קל להפעלה ידנית ללא מאמץ מופרז</text>
            
            <path d="M 290 190 L 170 190" fill="none" stroke="#334155" stroke-width="2"/>
            <text x="160" y="194" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="end">צירי פלדה מבוטנים היטב ללא חופשים</text>
            
            <text x="400" y="420" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">חלון הדף מגן מפני גלי הדף, רסיסים ואטימת גזים</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>