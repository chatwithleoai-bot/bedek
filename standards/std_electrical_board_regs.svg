<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="75" fill="#1e293b" rx="6" filter="url(#shadow)"/>
  <text x="400" y="58" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">תקנות החשמל (התקנת לוחות ומעגלים סופיים במתח עד 1000 וולט)</text>
  <text x="400" y="84" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">הארקת דלת מתכתית במוליך נחושת גמיש ומקרא מעגלים מפורט</text>
  
  <!-- Diagram Content -->
  
            <!-- Metal Cabinet Body -->
            <rect x="250" y="140" width="300" height="240" fill="#f8fafc" stroke="#334155" stroke-width="4" rx="4"/>
            
            <!-- Ground Bar -->
            <rect x="270" y="160" width="100" height="15" fill="#16a34a"/>
            <text x="320" y="172" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">פס הארקה PE</text>
            
            <!-- Breaker rows -->
            <rect x="270" y="200" width="260" height="40" fill="#e2e8f0" stroke="#94a3b8"/>
            <rect x="280" y="210" width="20" height="25" fill="#1e293b"/>
            <rect x="310" y="210" width="20" height="25" fill="#1e293b"/>
            <rect x="340" y="210" width="20" height="25" fill="#1e293b"/>
            <rect x="370" y="210" width="20" height="25" fill="#1e293b"/>
            
            <!-- Bonding Jumper to Door -->
            <path d="M 280 175 C 220 220, 210 300, 248 330" fill="none" stroke="#eab308" stroke-width="5"/>
            
            <!-- Callout for bonding -->
            <path d="M 220 250 L 140 250" fill="none" stroke="#eab308" stroke-width="2"/>
            <text x="130" y="254" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ca8a04" text-anchor="end">מוליך גישור הארקה גמיש ורציף לדלת</text>
            
            <!-- Callout for marking -->
            <path d="M 450 240 L 580 240" fill="none" stroke="#2563eb" stroke-width="2"/>
            <text x="590" y="244" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="start">מקרא מעגלים ברור ועמיד בלמינציה</text>
            
            <text x="400" y="420" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">צירי דלת אינם מהווים מוליך הארקה רציף תקני</text>
        
  
  <!-- Footer Brand / Standard stamp -->
  <rect x="25" y="455" width="750" height="30" fill="#f1f5f9" rx="4"/>
  <text x="35" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">צ. ביקורת מבנים | צוריאל צדוק - 053-9514613</text>
  <text x="765" y="475" font-family="Noto Sans Hebrew, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">תרשים תקן רשמי ומפרט טכני מחייב</text>
</svg>